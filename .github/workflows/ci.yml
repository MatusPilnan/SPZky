name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reused by release.yml so a release runs exactly the same checks.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Check, test, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Builds for the GitHub Pages sub-path (/<repo name>) and drives the app in
      # headless Chrome (preinstalled on ubuntu-latest), incl. offline loading.
      - name: Browser smoke test
        run: npm run smoke
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload smoke screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: .smoke/*.png
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: Database and sync
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Local Supabase stack in Docker (database, auth, API, Mailpit) with all
      # migrations from supabase/migrations applied. The CLI version is pinned in package.json.
      - name: Start local Supabase
        run: npm run db:start

      - name: Database tests (pgTAP, row-level security)
        run: npm run db:test

      - name: Database lint
        run: npm run db:lint

      # Builds against the local stack and drives several browser "devices"
      # through sign-in (code read from Mailpit), the conflict choices and sync.
      - name: Sync end-to-end test
        run: npm run sync:e2e
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Upload sync screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sync-screenshots
          path: .smoke/sync-*.png
          if-no-files-found: ignore
          retention-days: 7
