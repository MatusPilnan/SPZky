name: Release

# Publishes to GitHub Pages and creates a GitHub Release when a version tag is
# pushed (see "Releasing" in README.md). Pushes to main only run CI.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One Pages deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

  test:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  build:
    name: Build for Pages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails with a clear message if Pages isn't enabled with source "GitHub Actions".
      - uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The tag's section from CHANGELOG.md (written by `npm run release`).
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
