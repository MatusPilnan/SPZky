name: Release

# Publishes to GitHub Pages and creates a GitHub Release when a version tag is
# pushed (see "Releasing" in README.md). Pushes to main only run CI.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# One Pages deployment at a time; never cancel one that is running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

  test:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  # Applies new migrations (supabase/migrations) and the auth settings from
  # supabase/config.toml to the hosted project before the new app goes live.
  migrate:
    name: Migrate Supabase
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_SMTP_PASSWORD: ${{ secrets.SUPABASE_SMTP_PASSWORD }}
      SMTP_USER: ${{ vars.SMTP_USER }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the repository secrets and variables
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID SUPABASE_SMTP_PASSWORD SMTP_USER; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing in Settings → Secrets and variables → Actions:$missing"
            exit 1
          fi

      - name: Link the hosted project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations
        run: npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      # SMTP stays off in the committed config so the local stack keeps using
      # its mail catcher; the hosted project sends through the Gmail mailbox.
      - name: Turn on SMTP for the hosted project
        run: |
          sed -i '/^\[auth\.email\.smtp\]/,/^\[/ s/^enabled = false/enabled = true/' supabase/config.toml
          grep -A2 '^\[auth\.email\.smtp\]' supabase/config.toml

      - name: Push auth settings and email template
        run: npx supabase config push --yes

  build:
    name: Build for Pages
    needs: [test, migrate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Fails with a clear message if Pages isn't enabled with source "GitHub Actions".
      - uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Public values (the publishable key is meant for browsers; RLS protects the data).
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}

      - name: Check the build has the sync backend
        run: |
          if [ -z "$PUBLIC_SUPABASE_URL" ] || [ -z "$PUBLIC_SUPABASE_KEY" ]; then
            echo "::error::PUBLIC_SUPABASE_URL / PUBLIC_SUPABASE_KEY repository variables are missing."
            exit 1
          fi
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_KEY: ${{ vars.PUBLIC_SUPABASE_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    name: Create GitHub Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags for the release notes

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The tag's section from CHANGELOG.md (written by `npm run release`).
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs notes "$GITHUB_REF_NAME" > release-notes.md

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
