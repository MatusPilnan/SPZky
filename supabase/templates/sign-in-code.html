<!doctype html>
<html lang="sk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>ŠPZ-ky</title>
	</head>
	<body style="margin:0;padding:24px;background:#f4f6f8;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#1d2733;">
		<div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:12px;padding:24px;">
			<h1 style="margin:0 0 16px;font-size:20px;">ŠPZ-ky</h1>
			<p style="margin:0 0 8px;">Váš prihlasovací kód:</p>
			<p lang="en" style="margin:0 0 16px;color:#5b6775;">Your sign-in code:</p>
			<p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:8px;font-family:ui-monospace,Consolas,monospace;">{{ .Token }}</p>
			<p style="margin:0 0 8px;font-size:14px;">Zadajte ho v aplikácii. Platí 15 minút.</p>
			<p lang="en" style="margin:0 0 20px;font-size:14px;color:#5b6775;">Type it into the app. It is valid for 15 minutes.</p>
			<p style="margin:0;font-size:12px;color:#5b6775;">
				Ak ste o kód nežiadali, tento e-mail ignorujte.<br />
				<span lang="en">If you didn't ask for a code, ignore this email.</span>
			</p>
		</div>
	</body>
</html>
